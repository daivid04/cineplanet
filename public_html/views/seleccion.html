<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Tron Ares - Cineplanet</title>
    <link rel="stylesheet" href="../css/seleccion.css" />
</head>

<body>
    <!-- Barra de navegación superior -->
    <nav class="barra-navegacion">
        <div class="contenedor-navegacion">
            <!-- Logo de Cineplanet -->
            <div class="logo-cineplanet" onclick="window.location.href='../../index.html'" style="cursor: pointer;">
                <img src="../assets/icons/cineplanet_logo.jpg" alt="Logo Cineplanet" class="imagen-logo" />
                <span class="texto-logo">cineplanet</span>
            </div>

            <!-- Enlaces de navegación -->
            <ul class="menu-navegacion">
                <li><a href="peliculas.html" class="enlace-navegacion">Películas</a></li>
                <li><a href="cines.html" class="enlace-navegacion">Cines</a></li>
                <li><a href="../empleados.php" class="enlace-navegacion">Trabajadores</a></li>
                <li><a href="../admin/index.php" class="enlace-navegacion">Dashboard</a></li>
            </ul>

            <!-- Iconos de usuario y búsqueda -->
            <div class="acciones-navegacion">
                <button class="boton-icono" aria-label="Perfil de usuario" onclick="window.location.href='login.html'">
                    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2" />
                        <circle cx="12" cy="10" r="3" stroke-width="2" />
                        <path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.834 2.855" stroke-width="2" />
                    </svg>
                </button>
                <button class="boton-icono" aria-label="Buscar">
                    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8" stroke-width="2" />
                        <path d="m21 21-4.35-4.35" stroke-width="2" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <main class="contenedor-principal">
        <!-- Sección de detalles de la película -->
        <section class="seccion-detalles" id="seccion-detalles">
            <div class="contenedor-centrado">
                <!-- Encabezado con título y botón -->
                <div class="header-pelicula">
                    <div class="info-titulo">
                        <h1 class="titulo-pelicula" id="titulo-pelicula"></h1>
                        <p class="metadata-pelicula">
                            <span id="genero-pelicula">Ciencia Ficción</span> |
                            <span id="duracion-pelicula"></span> |
                            <span class="clasificacion" id="clasificacion-pelicula"></span>
                        </p>
                    </div>
                </div>

                <!-- Botón Comprar -->
                <div class="accion-comprar">
                    <button class="boton-comprar" id="boton-comprar">
                        <svg class="icono-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="8" width="18" height="12" rx="2" ry="2"></rect>
                            <line x1="7" y1="8" x2="7" y2="20"></line>
                            <line x1="17" y1="8" x2="17" y2="20"></line>
                        </svg>
                        <span>Comprar</span>
                    </button>
                </div>

                <!-- Contenedor de imagen y sinopsis -->
                <div class="contenedor-media">
                    <!-- Imagen de la película -->
                    <div class="contenedor-poster">
                        <img src="" alt="" class="poster-pelicula" id="poster-pelicula" />
                    </div>

                    <!-- Sinopsis y detalles -->
                    <div class="contenedor-info">
                        <h2 class="titulo-seccion">Sinopsis.</h2>
                        <p class="sinopsis" id="sinopsis-pelicula"></p>

                        <div class="seccion-idioma">
                            <h3 class="subtitulo-seccion">Idioma</h3>
                            <div class="opciones-idioma">
                                <button class="opcion-idioma activa" id="opcion-idioma" data-idioma="doblada"></button>
                            </div>
                        </div>

                        <div class="seccion-disponible">
                            <h3 class="subtitulo-seccion">Disponible</h3>
                            <p class="formatos-disponibles" id="formatos-disponibles"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de Horarios y Filtros -->
        <section class="seccion-horarios">
            <div class="contenedor-centrado">
                <h2 class="titulo-seccion-horarios">La función perfecta para ti.</h2>

                <!-- Filtros de selección -->
                <div class="filtros-seleccion">
                    <div class="filtro-item">
                        <label>Por ciudad</label>
                        <div class="select-wrapper">
                            <select class="select-filtro" id="filtro-ciudad">
                                <option value="tacna">Tacna</option>
                                <option value="lima">Lima</option>
                                <option value="arequipa">Arequipa</option>
                            </select>
                            <i class="fas fa-chevron-down icono-select"></i>
                        </div>
                    </div>
                    <div class="filtro-item">
                        <label>Por cine</label>
                        <div class="select-wrapper">
                            <select class="select-filtro" id="filtro-cine">
                                <option value="">Elige tu Cineplanet</option>
                            </select>
                            <i class="fas fa-chevron-down icono-select"></i>
                        </div>
                    </div>
                    <div class="filtro-item">
                        <label>Por fecha</label>
                        <div class="select-wrapper">
                            <select class="select-filtro" id="filtro-fecha">
                                <option value="hoy">Hoy</option>
                                <option value="manana">Mañana</option>
                            </select>
                            <i class="fas fa-chevron-down icono-select"></i>
                        </div>
                    </div>
                </div>

                <!-- Lista de Cines y Horarios -->
                <div class="lista-cines" id="lista-cines">
                    <!-- Los cines se renderizarán aquí dinámicamente -->
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="../js/seleccion.js"></script>
</body>

</html>
